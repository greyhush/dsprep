[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "dsprep"
version = "0.1.0"
description = "Training dataset preparation toolkit - format conversion, dedup, quality filtering, stats"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "greyhush"}
]
keywords = ["ml", "dataset", "training-data", "fine-tuning", "data-preparation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
dsprep = "dsprep.cli:main"

[tool.setuptools.packages.find]
include = ["dsprep*"]
